# Vhost for the Codekop PHP MVC container.
# The project has no public/ directory; document root is the project root
# and .htaccess (root) provides the front-controller rewrite + deny rules,
# so AllowOverride must stay All.
ServerName codekop.local

<VirtualHost *:80>
    ServerName codekop.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/codekop-error.log
    CustomLog ${APACHE_LOG_DIR}/codekop-access.log combined
</VirtualHost>
