; Codekop PHP MVC — container php.ini overrides.
; Merged on top of the php:8.4-apache image defaults.

date.timezone = Asia/Jakarta
expose_php = Off

memory_limit = 256M
max_execution_time = 60
post_max_size = 20M
upload_max_filesize = 20M

; APP_ENV controls error display in app/Config/Debug.php; keep the engine
; logging regardless of environment.
display_errors = Off
log_errors = On
error_log = /dev/stderr

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
; Set to 1 for local development so edited files are picked up without a
; container restart; 0 gives the best production performance.
opcache.validate_timestamps = 1
